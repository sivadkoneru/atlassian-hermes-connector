name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile check
        run: |
          python -m py_compile __init__.py schemas.py tools.py workflow.py \
            scripts/ticket.py scripts/jira_cron_sync.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
